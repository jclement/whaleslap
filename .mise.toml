[tools]
go = "1.26.0"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks."test:verbose"]
description = "Run all tests with verbose output"
run = "go test -v ./..."

[tasks."test:cover"]
description = "Run tests with coverage report"
run = "go test -coverprofile=coverage.out ./... && go tool cover -html=coverage.out -o coverage.html"

[tasks.build]
description = "Build the whaleslap binary (dev)"
run = "go build -o whaleslap ./cmd/whaleslap"

[tasks.lint]
description = "Run go vet"
run = "go vet ./..."

[tasks.release]
description = "Interactive release: bump version, tag, and build"
run = """
#!/bin/bash
set -e

# Get current version from git tags
CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
echo "Current version: $CURRENT_TAG"

# Parse version components
VERSION_NUM=${CURRENT_TAG#v}
IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"

# Calculate next versions
NEXT_PATCH="v$MAJOR.$MINOR.$((PATCH + 1))"
NEXT_MINOR="v$MAJOR.$((MINOR + 1)).0"
NEXT_MAJOR="v$((MAJOR + 1)).0.0"

echo ""
echo "Select version bump:"
echo "  1) Patch  -> $NEXT_PATCH"
echo "  2) Minor  -> $NEXT_MINOR"
echo "  3) Major  -> $NEXT_MAJOR"
echo "  4) Custom"
echo "  5) Cancel"
echo ""
read -p "Choice [1-5]: " CHOICE

case $CHOICE in
    1) NEW_VERSION=$NEXT_PATCH ;;
    2) NEW_VERSION=$NEXT_MINOR ;;
    3) NEW_VERSION=$NEXT_MAJOR ;;
    4) read -p "Enter version (e.g., v1.2.3): " NEW_VERSION ;;
    5) echo "Cancelled."; exit 0 ;;
    *) echo "Invalid choice"; exit 1 ;;
esac

# Validate version format
if [[ ! $NEW_VERSION =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
    echo "Error: Version must be in format v1.2.3"
    exit 1
fi

echo ""
echo "Will create release: $NEW_VERSION"
read -p "Continue? [y/N]: " CONFIRM
if [[ ! $CONFIRM =~ ^[Yy]$ ]]; then
    echo "Cancelled."
    exit 0
fi

# Create git tag
echo ""
echo "Creating git tag $NEW_VERSION..."
git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
echo "Tag created. Push with: git push origin $NEW_VERSION"

# Build binary
COMMIT=$(git rev-parse --short HEAD)
BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
echo ""
echo "Building release binary..."
CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=$NEW_VERSION -X main.commit=$COMMIT -X main.buildDate=$BUILD_DATE" -o whaleslap ./cmd/whaleslap
echo "Binary built: ./whaleslap"

echo ""
echo "Release $NEW_VERSION complete!"
echo ""
echo "Next steps:"
echo "  1. Push the tag: git push origin $NEW_VERSION"
echo "  2. Build Docker image: mise run docker:release"
"""

[tasks."release:all"]
description = "Build release binaries for all platforms"
run = """
VERSION=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo "dev")}
COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.buildDate=$BUILD_DATE"

echo "Building version: $VERSION"
mkdir -p dist

echo "  -> linux/amd64"
GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o dist/whaleslap-linux-amd64 ./cmd/whaleslap

echo "  -> linux/arm64"
GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o dist/whaleslap-linux-arm64 ./cmd/whaleslap

echo "  -> darwin/amd64"
GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o dist/whaleslap-darwin-amd64 ./cmd/whaleslap

echo "  -> darwin/arm64"
GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o dist/whaleslap-darwin-arm64 ./cmd/whaleslap

echo "Done! Binaries in dist/"
ls -la dist/
"""

[tasks."docker:build"]
description = "Build Docker image (dev)"
run = """
VERSION=${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo "dev")}
COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
echo "Building dev image: whaleslap:$VERSION"
docker build --build-arg VERSION=$VERSION --build-arg COMMIT=$COMMIT --build-arg BUILD_DATE=$BUILD_DATE -t whaleslap:$VERSION -t whaleslap:latest .
"""

[tasks."docker:release"]
description = "Build and tag release Docker image from git tag"
run = """
#!/bin/bash
set -e

# Get version from latest git tag
VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "")
if [ -z "$VERSION" ]; then
    echo "Error: HEAD is not tagged. Run 'mise run release' first."
    exit 1
fi

COMMIT=$(git rev-parse --short HEAD)
BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
IMAGE_NAME="ghcr.io/jclement/whaleslap"

# Parse version for major/minor tags (v1.2.3 -> v1, v1.2)
VERSION_NUM=${VERSION#v}
IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"
MAJOR_TAG="v$MAJOR"
MINOR_TAG="v$MAJOR.$MINOR"

echo "Building release image: $IMAGE_NAME:$VERSION"
echo "  Commit: $COMMIT"
echo "  Date: $BUILD_DATE"
echo ""

docker build \\
    --build-arg VERSION=$VERSION \\
    --build-arg COMMIT=$COMMIT \\
    --build-arg BUILD_DATE=$BUILD_DATE \\
    -t $IMAGE_NAME:$VERSION \\
    -t $IMAGE_NAME:$MAJOR_TAG \\
    -t $IMAGE_NAME:$MINOR_TAG \\
    -t $IMAGE_NAME:latest \\
    .

echo ""
echo "Images built:"
echo "  $IMAGE_NAME:$VERSION"
echo "  $IMAGE_NAME:$MINOR_TAG"
echo "  $IMAGE_NAME:$MAJOR_TAG"
echo "  $IMAGE_NAME:latest"
"""

[tasks."docker:push"]
description = "Push release Docker images to GHCR"
run = """
#!/bin/bash
set -e

VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "")
if [ -z "$VERSION" ]; then
    echo "Error: HEAD is not tagged."
    exit 1
fi

IMAGE_NAME="ghcr.io/jclement/whaleslap"

# Parse version for major/minor tags
VERSION_NUM=${VERSION#v}
IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"
MAJOR_TAG="v$MAJOR"
MINOR_TAG="v$MAJOR.$MINOR"

echo "Pushing $IMAGE_NAME:$VERSION..."
docker push $IMAGE_NAME:$VERSION

echo "Pushing $IMAGE_NAME:$MINOR_TAG..."
docker push $IMAGE_NAME:$MINOR_TAG

echo "Pushing $IMAGE_NAME:$MAJOR_TAG..."
docker push $IMAGE_NAME:$MAJOR_TAG

echo "Pushing $IMAGE_NAME:latest..."
docker push $IMAGE_NAME:latest

echo "Done!"
"""

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf whaleslap dist/ coverage.out coverage.html"
